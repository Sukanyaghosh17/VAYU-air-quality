{% extends "base.html" %}
{% block title %}VAYU — Sign In{% endblock %}

{% block body %}
<div class="login-page">
  <div class="login-card">

    <div class="login-logo">VAYU</div>
    <div class="login-sub">Air Quality Monitoring Platform</div>

    {% if form.errors %}
    <div class="login-error">
      ⚠ Invalid username or password. Please try again.
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" id="login-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-group">
        <label class="form-label" for="id_username">Username</label>
        <input class="form-input" type="text" name="username" id="id_username"
               autocomplete="username" autofocus required
               placeholder="Enter your username">
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password">Password</label>
        <div class="password-input-wrapper">
          <input class="form-input" type="password" name="password" id="id_password"
                 autocomplete="current-password" required
                 placeholder="Enter your password">
          <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('id_password', this)">
            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off-icon" style="display:none;" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <button class="btn-submit" type="submit" id="login-btn">Sign In →</button>
    </form>

    <div class="auth-footer" style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-secondary);">
      Don't have an account? 
      <a href="{% url 'signup' %}" style="color: var(--blue-light); text-decoration: none; font-weight: 600; margin-left: 4px;">Sign Up</a>
    </div>

  </div>
</div>

<script>
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const eyeIcon = btn.querySelector('.eye-icon');
  const eyeOffIcon = btn.querySelector('.eye-off-icon');
  if (input.type === 'password') {
    input.type = 'text';
    if (eyeIcon) eyeIcon.style.display = 'none';
    if (eyeOffIcon) eyeOffIcon.style.display = 'block';
  } else {
    input.type = 'password';
    if (eyeIcon) eyeIcon.style.display = 'block';
    if (eyeOffIcon) eyeOffIcon.style.display = 'none';
  }
}
</script>
{% endblock %}
