name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "ci-insecure-secret-key-for-tests-only"
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: "vayu.settings_test"
      DATABASE_URL: "sqlite:///:memory:"
      WAQI_API_TOKEN: "ci-placeholder-token"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linter (ruff)
        run: |
          ruff check .

      - name: Run tests
        run: |
          python manage.py test --settings=vayu.settings_test
